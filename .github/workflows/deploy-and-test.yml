name: Deploy Frontend & Run Selenium E2E Tests

# Adapted CI/CD pipeline: SpendAgent's web frontend is plain HTML/CSS/JS
# (frontend/), not a React app, so there is no "npm run build" step.
# GitHub Actions publishes frontend/ straight to GitHub Pages, then runs
# Selenium E2E tests against the live Pages URL.
#
# Architecture:
#   Developer Push -> GitHub Repository -> GitHub Actions Trigger
#   -> Deploy frontend/ to GitHub Pages -> Selenium E2E Testing
#   -> Production Validation -> Pass / Fail Report

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'selenium-tests/**'
      - '.github/workflows/deploy-and-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  selenium-tests:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Selenium test dependencies
        working-directory: selenium-tests
        run: npm install

      - name: Run Selenium E2E tests against the live Pages site
        working-directory: selenium-tests
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: selenium-tests/mochawesome-report
          if-no-files-found: ignore
